    <script>
      // Make window.fetch writable so browser extensions can intercept requests without throwing TypeError
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return customFetch;
            },
            set: function(fn) {
              customFetch = fn;
            }
          });
        } catch (e) {}

        // Suppress uncaught browser extension errors
        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && event.message.indexOf('fetch of #<Window>') !== -1)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
